[package]
name = "meetily-gpui"
version = "0.1.0"
description = "Parley desktop app built on GPUI, linking meetily-core directly"
license = "MIT"
edition = "2024"
rust-version = "1.85"
publish = false

[[bin]]
name = "meetily-gpui"
path = "src/main.rs"

[features]
default = []
# GPU backends for whisper.cpp, forwarded to meetily-core (same names as the
# Tauri shell so build scripts can pass `--features cuda` to either app).
cuda = ["meetily-core/cuda"]
vulkan = ["meetily-core/vulkan"]
hipblas = ["meetily-core/hipblas"]
openblas = ["meetily-core/openblas"]
openmp = ["meetily-core/openmp"]

[dependencies]
meetily-core = { path = "../meetily-core" }

# Component kit: re-exports gpui (as `gpui-pre`) + gpui-component + assets.
# Depend on gpui ONLY through this — a second gpui-pre (or zed's git gpui)
# yields incompatible types (longbridge/gpui-kit#2532).
gpui-kit = "0.6"

anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.32.0", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
# `_exit` on shutdown, same as the Tauri shell.
libc = "0.2"
