[package]
name = "meetily"
version = "0.4.0"
description = "A Tauri App for meeting minutes"
authors = ["Sujith S"]
license = "MIT"
repository = "https://github.com/Hankanman/Meetily-Local"
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }
reqwest = { version = "0.11", features = ["blocking", "multipart", "json", "stream"] }
which = "6.0.1"
tar = "0.4"           # TAR extraction (FFmpeg archive)
xz2 = "0.1"           # XZ decompression (FFmpeg archive)


[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
# Tauri-free core: audio, transcription, diarization, summaries, persistence.
meetily-core = { path = "../../meetily-core", default-features = false }
# Wire protocol shared with the llama-helper sidecar.
llama-protocol = { path = "../../llama-protocol" }
# Used only for `_exit` on shutdown — see the RunEvent::Exit handler in lib.rs.
libc = "0.2"
# Encoding per-segment audio clips for playback in the webview.
base64 = "0.22"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Dates
chrono = { version = "0.4.31", features = ["serde"] }

# Log
log = "0.4"
env_logger = "0.11"
tracing = "0.1.40"

# Speech recognition and async utilities
# NOTE: whisper-rs is declared in the Linux target-specific section below
futures-util = "0.3"

# Async
tokio = { version = "1.32.0", features = ["full", "tracing"] }

reqwest = { version = "0.11", features = ["multipart", "json", "stream"] }

# Directories
dirs = "5.0.1"

sqlx = { version = "0.8", features = [ "runtime-tokio", "sqlite", "chrono"] }

# Common Tauri configuration
tauri = { version = "2.11.0", features = [ "devtools", "macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-fs = "2.5.0"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-notification = "2.3.3"
tauri-plugin-process = "2.3.1"
tauri-plugin-os = "2.3.2"

# Linux-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["raw-api", "log_backend"] }

[dev-dependencies]
criterion = { version = "0.5.1", features = ["async_tokio"] }

# GPU acceleration / spike features simply forward to meetily-core, which
# owns the whisper-rs/backend_probe feature wiring. Kept under the same
# names here so `./build.sh`/`./dev.sh`/`pnpm tauri:*` invocations with
# `--features cuda` etc. keep working unchanged.
#
# BUILD INSTRUCTIONS:
# ===================
# Linux:     cargo build --release              (CPU with OpenBLAS)
#            cargo build --release --features cuda    (NVIDIA GPU)
#            cargo build --release --features hipblas (AMD GPU with ROCm)
#            cargo build --release --features vulkan  (Other GPUs)
#
# QUICK START: Use ./build.sh (see repo root)
#
[features]
default = ["platform-default"]
platform-default = ["meetily-core/platform-default"]
cuda = ["meetily-core/cuda"]
vulkan = ["meetily-core/vulkan"]
hipblas = ["meetily-core/hipblas"]
openblas = ["meetily-core/openblas"]
openmp = ["meetily-core/openmp"]
backend_probe = ["meetily-core/backend_probe"]
