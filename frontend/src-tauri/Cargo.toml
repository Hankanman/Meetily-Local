[package]
name = "meetily"
version = "0.4.0"
description = "A Tauri App for meeting minutes"
authors = ["Sujith S"]
license = "MIT"
repository = "https://github.com/Hankanman/Meetily-Local"
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


# Hardware acceleration features for whisper-rs (Linux-only build)
#
# BUILD INSTRUCTIONS:
# ===================
# Linux:     cargo build --release              (CPU with OpenBLAS)
#            cargo build --release --features cuda    (NVIDIA GPU)
#            cargo build --release --features hipblas (AMD GPU with ROCm)
#            cargo build --release --features vulkan  (Other GPUs)
#
# QUICK START: Use ./build.sh (see repo root)
#
[features]
default = ["platform-default"]  # Automatically enables best backend per platform

# Platform-appropriate defaults - see target-specific dependencies below
platform-default = []

# Manual GPU acceleration options (for power users to override defaults)
cuda = ["whisper-rs/cuda"]         # Linux: NVIDIA CUDA GPU
vulkan = ["whisper-rs/vulkan"]     # Linux: AMD/Intel Vulkan GPU
hipblas = ["whisper-rs/hipblas"]   # Linux: AMD ROCm HIP

# CPU optimizations (fallback for systems without GPU)
openblas = ["whisper-rs/openblas"] # Optimized BLAS (Auto-enabled on Windows/Linux)
openmp = ["whisper-rs/openmp"]     # OpenMP parallel processing

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }
reqwest = { version = "0.11", features = ["blocking", "multipart", "json", "stream"] }
which = "6.0.1"
tar = "0.4"           # TAR extraction (FFmpeg archive)
xz2 = "0.1"           # XZ decompression (FFmpeg archive)


[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
# Used only for `_exit` on shutdown — see the RunEvent::Exit handler in lib.rs.
libc = "0.2"
# Encoding per-segment audio clips for playback in the webview.
base64 = "0.22"
once_cell = "1.17.1"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Wav encoding - now using manual WAV creation instead of hound
# hound = "3.5"

# Dates
chrono = { version = "0.4.31", features = ["serde"] }

# Log
log = "0.4"
env_logger = "0.11"
tracing = "0.1.40"
which = "6.0.1"

# Bytes
bytemuck = "1.16.1"

# EBU R128 loudness normalization (professional broadcast standard)
ebur128 = "0.1"

# Noise suppression - RNNoise-based neural network noise reduction
nnnoiseless = "0.5"

# Speech recognition and async utilities
# NOTE: whisper-rs is declared in the Linux target-specific section below
futures-util = "0.3"

# General error handling helper
thiserror = "2.0.16"

# Speaker diarization + VAD via sherpa-onnx. Provides:
# - SpeakerEmbeddingExtractor (3D-Speaker CAM++) for "who's speaking" attribution
# - VoiceActivityDetector (silero-vad ONNX) for speech segmentation
#
# Linked with the `shared` feature (instead of the default `static`) because
# the static linkage caused `free(): invalid pointer` aborts on Linux when
# sherpa's bundled onnxruntime tried to load its first model alongside
# whisper-rs's whisper.cpp — two static C++ runtimes in one binary collided
# on glibc allocator state. Shared linkage keeps onnxruntime in a separate
# .so loaded at runtime, which has different symbol-visibility and TLS
# semantics. Prebuilt .so is fetched at build time, dropped next to the
# binary, and resolved via rpath / LD_LIBRARY_PATH.
sherpa-onnx = { version = "1.13.0", default-features = false, features = ["shared"] }

# Async
tokio = { version = "1.32.0", features = ["full", "tracing"] }
tokio-util = "0.7"  # Utilities for tokio including CancellationToken

reqwest = { version = "0.11", features = ["multipart", "json", "stream"] }


# Directories
dirs = "5.0.1"

# Additional dependencies for notification system
url = "2.5.0"


# System monitoring for resource management
sysinfo = "0.32"

realfft = "3.4.0"
regex = "1.11.0"

symphonia = { version = "0.5.4", features = ["aac", "isomp4", "mp3", "flac", "ogg", "vorbis", "pcm", "wav", "opt-simd"] }
rayon = "1.10"
rubato = "0.15.0"
tempfile = "3.3.0"

ffmpeg-sidecar = { git = "https://github.com/nathanbabcock/ffmpeg-sidecar", branch = "main" }

sqlx = { version = "0.8", features = [ "runtime-tokio", "sqlite", "chrono"] }

# Calendar / ICS parsing
ical = "0.11"
rrule = "0.13"
chrono-tz = "0.10"

# Common Tauri configuration
tauri = { version = "2.11.0", features = [ "devtools", "macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-fs = "2.5.0"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-notification = "2.3.3"
tauri-plugin-process = "2.3.1"
tauri-plugin-os = "2.3.2"

# Linux-specific dependencies
# Default: CPU-only build (no BLAS)
# Users can enable features manually:
#   --features cuda     (NVIDIA GPUs)
#   --features vulkan   (AMD/Intel GPUs)
#   --features hipblas  (AMD ROCm)
#   --features openblas (OpenBLAS optimization, requires BLAS_INCLUDE_DIRS)
[target.'cfg(target_os = "linux")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["raw-api", "log_backend"] }
pipewire = { version = "0.10", features = ["v0_3_44"] }

[dev-dependencies]
criterion = { version = "0.5.1", features = ["async_tokio"] }
